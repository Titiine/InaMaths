# Publie InaMaths sur GitHub Pages (site statique construit avec Vite).
# Une fois ce fichier sur GitHub :
#   Settings ▸ Pages ▸ "Build and deployment" ▸ Source = "GitHub Actions".
# L'app sera ensuite en ligne à l'adresse indiquée à la fin du job "deploy".
name: Déployer sur GitHub Pages

on:
  push:
    branches:
      - claude/multilang-edu-app-avatars-tr9v23
      - main
  workflow_dispatch: # permet aussi de lancer le déploiement à la main

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'application
        run: npm run build

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
